<title>LEDGER</title>
<style>
:root{
  --bg:#FAF9F5; --bg-2:#F0EEE6; --surface:#FFFFFF; --ink:#191919; --ink-soft:#6F6B62; --ink-faint:#9A958B;
  --line:rgba(25,25,25,.08); --line-2:rgba(25,25,25,.14);
  --glass:rgba(255,255,255,.58); --glass-edge:rgba(255,255,255,.8);
  --shadow:0 1px 2px rgba(25,25,25,.04),0 8px 28px rgba(25,25,25,.06);
  --ledger:#C96442; --ledger-soft:rgba(201,100,66,.12);
  --invest:#2F8A5F; --invest-soft:rgba(47,138,95,.12);
  --health:#B8860B; --health-soft:rgba(214,160,20,.16);
  --pos:#2F8A5F; --neg:#B4442E; --warn:#C27C0E; --plan:#8A8478;
  --tab:#262624; --tab-ink:#8F8A81; --tab-on:#fff;
  --r-l:22px; --r-m:16px; --r-s:11px;
  --pad:16px; --gap:14px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Sukhumvit Set","Thonburi","Helvetica Neue",system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Sukhumvit Set","Thonburi",system-ui,sans-serif;
  --round:"SF Pro Rounded",ui-rounded,-apple-system,system-ui,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#1C1B1A; --bg-2:#262523; --surface:#2A2826; --ink:#F5F4EF; --ink-soft:#A8A399; --ink-faint:#77726A;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --glass:rgba(42,40,38,.62); --glass-edge:rgba(255,255,255,.07);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.28);
  --ledger:#E08360; --ledger-soft:rgba(224,131,96,.16);
  --invest:#6CC79A; --invest-soft:rgba(108,199,154,.15);
  --health:#F2C230; --health-soft:rgba(242,194,48,.15);
  --pos:#74C79B; --neg:#EE8B72; --warn:#F0B44C; --plan:#8F897E;
  --tab:#0F0F0E; color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1C1B1A; --bg-2:#262523; --surface:#2A2826; --ink:#F5F4EF; --ink-soft:#A8A399; --ink-faint:#77726A;
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
    --glass:rgba(42,40,38,.62); --glass-edge:rgba(255,255,255,.07);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.28);
    --ledger:#E08360; --ledger-soft:rgba(224,131,96,.16);
    --invest:#6CC79A; --invest-soft:rgba(108,199,154,.15);
    --health:#F2C230; --health-soft:rgba(242,194,48,.15);
    --pos:#74C79B; --neg:#EE8B72; --warn:#F0B44C; --plan:#8F897E;
    --tab:#0F0F0E; color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent,var(--ledger));outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.hide-amt .amt{filter:blur(7px);transition:filter .2s}

/* drifting colour orbs — one per section, the page tints toward the open tab */
.orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orbs i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(80px);opacity:.38;transition:transform 1.6s cubic-bezier(.2,.7,.2,1),opacity 1s}
.orbs .o1{background:var(--ledger);top:-30vmax;left:-24vmax}
.orbs .o2{background:var(--invest);bottom:-34vmax;right:-26vmax;opacity:.26}
.orbs .o3{background:var(--health);top:30vh;left:55vw;opacity:.22;width:40vmax;height:40vmax}
[data-view="invest"] .orbs .o2{transform:translate(-10vw,-12vh);opacity:.42}
[data-view="health"] .orbs .o3{transform:translate(-22vw,-14vh);opacity:.4}
[data-view="ledger"] .orbs .o1{transform:translate(8vw,6vh);opacity:.46}
@media (prefers-reduced-motion:reduce){.orbs i{transition:none}}

/* shell */
.app{position:relative;z-index:1;display:grid;grid-template-columns:1fr;min-height:100dvh}
.nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:2px;padding:6px;background:var(--tab);border-radius:26px;box-shadow:0 8px 30px rgba(0,0,0,.28)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:62px;padding:7px 8px 6px;border-radius:20px;color:var(--tab-ink);font-size:10.5px;font-weight:600;letter-spacing:.01em}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--tab-on);background:rgba(255,255,255,.1)}
.nav button[aria-current="page"] .dot{background:var(--sec)}
.nav .dot{width:5px;height:5px;border-radius:50%;background:transparent;margin-top:1px}
.nav .brand,.nav .navfoot{display:none}
main{padding:calc(env(safe-area-inset-top) + 8px) max(16px,env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));max-width:1320px;width:100%;margin:0 auto}

.top{display:flex;align-items:center;gap:10px;min-height:52px;margin-bottom:6px}
.top h1{font-family:var(--display);font-size:30px;line-height:1.1;font-weight:750;letter-spacing:-.02em;margin:0;flex:1}
.top .sub{display:block;font-size:13px;font-weight:500;color:var(--ink-soft);letter-spacing:0;margin-top:3px}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--glass-edge);box-shadow:var(--shadow);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
.iconbtn svg{width:19px;height:19px}

/* cards */
.grid{display:grid;gap:var(--gap);grid-template-columns:1fr}
.card{position:relative;background:var(--glass);border:1px solid var(--glass-edge);border-radius:var(--r-l);padding:var(--pad);box-shadow:var(--shadow);backdrop-filter:blur(34px) saturate(1.4);-webkit-backdrop-filter:blur(34px) saturate(1.4);min-width:0}
.card h2{font-size:15px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:8px;letter-spacing:-.005em}
.card h2 .meta{margin-left:auto;font-size:12.5px;font-weight:500;color:var(--ink-faint)}
.card.flat{background:transparent;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:0}
.muted{color:var(--ink-soft)} .faint{color:var(--ink-faint)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.small{font-size:12.5px} .tiny{font-size:11.5px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--bg-2);color:var(--ink-soft);white-space:nowrap}
.chip.sec{background:var(--sec-soft);color:var(--sec)}
.chip.pos{background:rgba(47,138,95,.12);color:var(--pos)} .chip.neg{background:rgba(180,68,46,.11);color:var(--neg)} .chip.warn{background:rgba(194,124,14,.13);color:var(--warn)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--bg-2);gap:2px}
.seg button{padding:6px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .r{text-align:right;flex:none}
button.li{width:100%;text-align:left}
.bar{height:8px;border-radius:99px;background:var(--bg-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--sec)}
.empty{padding:22px 6px;text-align:center;color:var(--ink-soft)}

/* section accents */
.s-ledger{--sec:var(--ledger);--sec-soft:var(--ledger-soft)}
.s-invest{--sec:var(--invest);--sec-soft:var(--invest-soft)}
.s-health{--sec:var(--health);--sec-soft:var(--health-soft)}

/* hero figure — the one loud thing on each page */
.hero{padding:20px var(--pad) 18px}
.hero .lbl{font-size:13px;font-weight:600;color:var(--ink-soft)}
.big{font-family:var(--round);font-weight:700;font-size:clamp(40px,11vw,60px);line-height:1;letter-spacing:-.035em;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.big small{font-size:.42em;font-weight:600;letter-spacing:0;color:var(--ink-soft);margin-right:3px;vertical-align:.55em}
.mid{font-family:var(--round);font-weight:700;font-size:24px;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.stat{padding:10px 11px;border-radius:var(--r-m);background:var(--bg-2)}
:root[data-theme="dark"] .stat{background:rgba(255,255,255,.04)}
.stat b{display:block;font-family:var(--round);font-size:17px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:11.5px;color:var(--ink-soft);font-weight:500}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--sec)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.live::before{animation:none}}

/* home lanes */
.lanes{display:flex;flex-direction:column;justify-content:space-around}
.lane{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px var(--pad);text-align:left;width:100%}
.lane .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--sec-soft);color:var(--sec)}
.lane .ic svg{width:22px;height:22px}
.lane .k{font-size:12.5px;color:var(--ink-soft);font-weight:600}
.lane .v{font-family:var(--round);font-weight:700;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.lane .x{font-size:12.5px;color:var(--ink-soft)}
.lane .chev{color:var(--ink-faint)}

/* charts */
svg.chart{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-soft);margin-top:8px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}

/* week strip (health) */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{border-radius:13px;padding:7px 3px 8px;text-align:center;background:var(--bg-2);font-size:11px;color:var(--ink-soft);min-width:0}
:root[data-theme="dark"] .day{background:rgba(255,255,255,.04)}
.day b{display:block;font-size:15px;color:var(--ink);font-family:var(--round)}
.day .k{display:block;margin-top:4px;height:6px;width:6px;border-radius:50%;margin-inline:auto;background:var(--line-2)}
.day.today{outline:2px solid var(--sec)}
.day.done .k{background:var(--pos)} .day.rest .k{background:transparent;border:1px solid var(--line-2)}
.day.race .k{background:var(--health)} .day.test .k{background:#D9548B}
.ring{position:relative;display:grid;place-items:center}
.ring svg{transform:rotate(-90deg)}
.ring .in{position:absolute;text-align:center;line-height:1.1}
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.rings .ring .in b{font-family:var(--round);font-size:15px}
.rings .cap{font-size:11.5px;color:var(--ink-soft);margin-top:4px}

/* stock rows */
.sym{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;flex:none;letter-spacing:-.02em}
.spark{width:64px;height:24px;flex:none}

/* sheet (detail) */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(20,18,16,.38);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:88dvh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line-2);margin:0 auto 12px}
.sheet-open .sheet-bg{opacity:1;pointer-events:auto}
.sheet-open .sheet{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){.sheet,.sheet-bg{transition:none}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--ink-soft)} .kv dd{margin:0;text-align:right;font-weight:600}
.quote{border-left:3px solid var(--sec);padding:4px 0 4px 12px;margin:10px 0;color:var(--ink)}
ul.plain{margin:6px 0 0;padding-left:18px} ul.plain li{margin:3px 0}

.toast{position:fixed;z-index:50;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tab);color:#fff;padding:10px 16px;border-radius:14px;font-size:13.5px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:14px;font-weight:650;background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--bg-2);color:var(--ink)}
.btn.sec{background:var(--sec);color:#fff}
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r-l);padding:26px 18px;text-align:center}
.drop.over{border-color:var(--ledger);background:var(--ledger-soft)}
input[type=number],input[type=text],input[type=search]{font:inherit;color:var(--ink);background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;width:100%}

/* ===== layouts: phone → fold (open) → iPad → Mac ===== */
.span2,.span3{grid-column:auto}
@media (min-width:600px){
  .grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.g2 .span2{grid-column:1/-1}
  .sheet{left:50%;right:auto;width:min(620px,94vw);transform:translate(-50%,105%);border-radius:24px 24px 0 0}
  .sheet-open .sheet{transform:translate(-50%,0)}
}
/* tablet / Mac / open foldable: sidebar */
@media (min-width:820px){
  .app{grid-template-columns:232px 1fr}
  .nav{position:sticky;top:0;left:auto;bottom:auto;transform:none;height:100dvh;flex-direction:column;gap:4px;border-radius:0;padding:calc(18px + env(safe-area-inset-top)) 12px 18px;box-shadow:none;background:transparent;border-right:1px solid var(--line)}
  .nav .brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.02em;color:var(--ink)}
  .nav .brand img{width:28px;height:28px;border-radius:8px}
  .nav button{flex-direction:row;justify-content:flex-start;gap:12px;min-width:0;padding:10px 12px;border-radius:13px;font-size:14.5px;color:var(--ink-soft);font-weight:600}
  .nav button[aria-current="page"]{background:var(--glass);color:var(--ink);box-shadow:var(--shadow)}
  .nav button svg{width:20px;height:20px}
  .nav .dot{margin:0 0 0 auto}
  .nav .navfoot{display:block;margin-top:auto;padding:10px 12px;font-size:12px;color:var(--ink-faint)}
  main{padding:calc(env(safe-area-inset-top) + 22px) 28px 40px}
  .top h1{font-size:34px}
  .toast{bottom:28px}
}
@media (min-width:1100px){
  :root{--pad:20px;--gap:18px}
  .grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid.g3 .span2{grid-column:span 2}
  .grid.g3 .span3{grid-column:1/-1}
  .grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (min-width:820px) and (max-width:1099px){
  .grid.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.g3 .span2,.grid.g3 .span3{grid-column:1/-1}
}
@media (min-width:600px) and (max-width:819px){
  .grid.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.g3 .span2,.grid.g3 .span3{grid-column:1/-1}
}
/* foldable split across a hinge: keep content off the fold */
@media (horizontal-viewport-segments:2){
  main{padding-left:16px;padding-right:16px}
  .grid.g2,.grid.g3{grid-template-columns:calc(env(viewport-segment-width 0 0) - 32px) calc(env(viewport-segment-width 1 0) - 32px);column-gap:calc(env(viewport-segment-left 1 0) - env(viewport-segment-right 0 0) + 32px)}
}
</style>

<script>
'use strict';
/* ================= storage ================= */
const K = { data:'app2-data', view:'app2-view', theme:'app2-theme', hide:'app2-hide', hxDone:'app2-hx-done', hxKm:'app2-hx-km', invSeg:'app2-inv-seg', key:'app2-key' };
const ls = {
  get(k, d){ try{ const v = localStorage.getItem(k) ?? localStorage.getItem(k+'~mirror'); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ const t = JSON.stringify(v); localStorage.setItem(k, t); localStorage.setItem(k+'~mirror', t); }catch(e){} },
  raw(k){ try{ return localStorage.getItem(k) ?? localStorage.getItem(k+'~mirror'); }catch(e){ return null; } }
};
let DATA = ls.get(K.data, null);
const S = { view: ls.get(K.view,'home'), ledMonth: null, invSeg: ls.get(K.invSeg,'dca'), q:'' };

/* ================= helpers ================= */
const $ = (s, el=document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_MF = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_D = ['อา','จ','อ','พ','พฤ','ศ','ส'];
const TH_DF = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const mkOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1);
const dOf = s => { const p = String(s).slice(0,10).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); };
const DAY = 864e5;
const daysIn = mk => new Date(+mk.slice(0,4), +mk.slice(5,7), 0).getDate();
const thMonth = (mk, full) => (full?TH_MF:TH_M)[+mk.slice(5,7)-1] + ' ' + (+mk.slice(0,4)+543);
const thDate = (s, withDow) => { const d = dOf(s); return (withDow? TH_D[d.getDay()]+' ' : '') + d.getDate()+' '+TH_M[d.getMonth()]; };
const B = (n, d=0) => '฿' + Math.round(n||0).toLocaleString('en-US', {maximumFractionDigits:d});
const Bk = n => { const a = Math.abs(n||0), s = n<0?'−':''; return s+'฿'+(a>=1e6 ? (a/1e6).toFixed(a>=1e7?1:2)+'M' : a>=1e4 ? (a/1e3).toFixed(a>=1e5?0:1)+'k' : Math.round(a).toLocaleString('en-US')); };
const P = (x, d=1) => (x>0?'+':x<0?'−':'') + Math.abs((x||0)*100).toFixed(d) + '%';
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
const amt = (s) => `<span class="amt">${s}</span>`;
const ago = (t) => { if(!t) return '—'; const ms = Date.now() - new Date(t).getTime(); if(isNaN(ms)) return '—'; const m = Math.round(ms/6e4);
  return m<1?'เมื่อกี้': m<60? m+' นาทีที่แล้ว' : m<1440? Math.round(m/60)+' ชม.ที่แล้ว' : Math.round(m/1440)+' วันที่แล้ว'; };
const hm = v => { const m = /^(\d{1,2}):(\d{2})/.exec(v||''); return m ? (+m[1])*60 + (+m[2]) : null; };
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('on'), 2600); }
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ================= charts (inline SVG) ================= */
function sparkSVG(vals, color, w=64, h=24){
  const v = (vals||[]).filter(x => x!=null); if(v.length<2) return `<svg class="spark" viewBox="0 0 ${w} ${h}"></svg>`;
  const lo = Math.min(...v), hi = Math.max(...v), r = hi-lo || 1;
  const pts = v.map((y,i) => [i*(w-2)/(v.length-1)+1, h-2-(y-lo)/r*(h-4)]);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" points="${pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ')}"/></svg>`;
}
function ringSVG(frac, size, stroke, color, track){
  const r = (size-stroke)/2, c = 2*Math.PI*r, f = clamp(frac||0, 0, 1);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track||'var(--bg-2)'}" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${(c*f).toFixed(1)} ${c.toFixed(1)}"/></svg>`;
}
/* cumulative month chart: actual (solid), booked (dashed), pace (thin) */
function cumChart(mk, actualByDay, bookedByDay, todayIdx, color){
  const n = daysIn(mk), W = 600, H = 190, L = 4, R = 4, T = 12, Bm = 22;
  let a=0, b=0; const A=[], Bb=[];
  for(let d=1; d<=n; d++){ const k = mk+'-'+pad(d); a += actualByDay[k]||0; b += (actualByDay[k]||0)+(bookedByDay[k]||0); A.push(a); Bb.push(b); }
  const upTo = todayIdx==null ? n : todayIdx;
  const earned = A[upTo-1]||0, pace = upTo>0 ? earned/upTo*n : 0;
  const max = Math.max(b, pace, 1)*1.08;
  const x = i => L + i*(W-L-R)/(n-1), y = v => T + (H-T-Bm)*(1 - v/max);
  const path = (arr, k) => arr.slice(0,k).map((v,i) => (i?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1)).join('');
  const area = upTo>0 ? path(A, upTo)+`L${x(upTo-1).toFixed(1)},${y(0)}L${x(0)},${y(0)}Z` : '';
  const ticks = [1, 8, 15, 22, n].map(d => `<text x="${x(d-1)}" y="${H-5}" font-size="11" fill="var(--ink-faint)" text-anchor="${d===1?'start':d===n?'end':'middle'}">${d}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="รายรับสะสมทั้งเดือน">
    <defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line-2)"/>
    <path d="${path(Bb, n)}" fill="none" stroke="var(--plan)" stroke-width="2" stroke-dasharray="5 5"/>
    ${upTo>0?`<line x1="${x(0)}" y1="${y(0)}" x2="${x(n-1)}" y2="${y(pace)}" stroke="var(--pos)" stroke-width="1.5" opacity=".9"/>`:''}
    ${area?`<path d="${area}" fill="url(#ga)"/>`:''}
    <path d="${path(A, upTo)}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    ${upTo>0?`<circle cx="${x(upTo-1)}" cy="${y(earned)}" r="5" fill="${color}" stroke="var(--surface)" stroke-width="2"/>`:''}
    ${ticks}</svg>`;

function barsSVG(items, opts={}){ // items [{label, v, v2?, hi?}]
  const W = opts.w||340, H = opts.h||150, T = 12, Bm = 20, n = items.length, gap = n>20?3:n>10?5:8;
  const max = Math.max(1, ...items.map(i => Math.max(i.v||0, i.v2||0, opts.target||0)))*1.1;
  const bw = (W - gap*(n-1))/n;
  const y = v => T + (H-T-Bm)*(1 - v/max);

  items.forEach((it,i) => {
    const x0 = i*(bw+gap);
    if(it.v2!=null){ const w2 = bw/2-2;
      s += `<rect x="${x0}" y="${y(it.v)}" width="${w2}" height="${Math.max(0,y(0)-y(it.v))}" rx="4" fill="${opts.c1}" opacity="${it.hi?1:.85}"/>`;
      s += `<rect x="${x0+w2+4}" y="${y(it.v2)}" width="${w2}" height="${Math.max(0,y(0)-y(it.v2))}" rx="4" fill="${opts.c2}" opacity="${it.hi?1:.75}"/>`;
    } else s += `<rect x="${x0}" y="${y(it.v||0)}" width="${bw}" height="${Math.max(0,y(0)-y(it.v||0))}" rx="5" fill="${it.c||opts.c1}" opacity="${it.hi||opts.flat?1:.55}"/>`;

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||'กราฟแท่ง')}">${s}</svg>`;
}
function donutSVG(parts, size=132, stroke=18){
  const tot = parts.reduce((a,p)=>a+p.v,0)||1, r = (size-stroke)/2, c = 2*Math.PI*r; let off = 0;
  const segs = parts.map(p => { const len = c*p.v/tot; const s = `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${p.c}" stroke-width="${stroke}" stroke-dasharray="${Math.max(0,len-2).toFixed(1)} ${c.toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}"/>`; off += len; return s; }).join('');

}

/* ================= LEDGER model ================= */
/* Live from Locum Ledger when this page shares its origin (same site, same browser), else the Mac bundle. */
function locumLive(){
  let tx, places;
  try{ tx = JSON.parse(ls.raw('ll-tx-v1')||'null'); places = JSON.parse(ls.raw('ll-places-v1')||'null'); }catch(e){}
  if(!Array.isArray(tx) || !tx.length || !Array.isArray(places)) return null;
  const pById = {}; places.forEach(p => pById[p.id] = p);
  const rv = (p,k) => Number(p && p.rates ? p.rates[k] : 0) || 0;
  const tierH = {};
  tx.forEach(t => { if(t.type==='income' && t.meta && t.meta.hours && t.date){ const key = t.placeId+'|'+t.catKey+'|'+t.date.slice(0,7); tierH[key] = (tierH[key]||0) + t.meta.hours; } });
  const eff = t => {
    const p = pById[t.placeId]; const c = p && (p.categories||[]).find(x => x.key===t.catKey);
    if(!(c && c.formulaKey==='sairee_hourly' && t.meta && t.meta.hours!=null)) return +t.amount||0;
    const h = tierH[t.placeId+'|'+t.catKey+'|'+t.date.slice(0,7)]||0;
    const rate = h<=rv(p,'tier1max') ? rv(p,'tier1') : h<=rv(p,'tier2max') ? rv(p,'tier2') : rv(p,'tier3');
    return (t.meta.hours||0)*rate;
  };
  const shifts = tx.filter(t => t.type==='income' && t.date).map(t => ({ id:t.id, date:t.date.slice(0,10), start:t.startTime||'', end:t.endTime||'',
    place:t.placeName || (pById[t.placeId]||{}).name || '', cat:t.catLabel||'', note:(t.note||''), amount:Math.round(eff(t)*100)/100,
    hours:(t.meta&&t.meta.hours)||0, planned:!!t.planned, paid:t.paid===true }));
  let exp = null;
  try{ const mj = JSON.parse(ls.raw('ll-meowjot-v1')||'null'); if(mj && mj.months) exp = mj.months; }catch(e){}
  return { shifts, expMonths: exp, src:'live' };
}
function ledgerModel(){
  const live = locumLive();
  const L = (DATA && DATA.ledger) || {};
  let shifts = live ? live.shifts : (L.shifts||[]).slice();
  // widget quick-adds that Locum Ledger has not imported yet
  const ids = new Set(shifts.map(s => s.id));
  (L.quickadd||[]).forEach(q => { if(!ids.has(q.id) && !shifts.some(s => s.date===q.date && s.cat===q.catLabel && Math.abs(s.amount-q.amount)<1))
    shifts.push({ id:q.id, date:q.date, start:'', end:'', place:'', cat:q.catLabel||'Quick add', note:(q.note||'')+' · quick add', amount:+q.amount||0, hours:0, planned:false, paid:false, qa:true }); });
  // spending by month → {mk:{expByDay,total,invest}}
  let exp = {};
  if(live && live.expMonths) exp = live.expMonths;
  else if(L.exp && L.exp.expMonthKey) exp[L.exp.expMonthKey] = { expByDay:L.exp.expByDay||{}, total:L.exp.expMonth||0, importedAt:L.exp.expAt };
  const inv = L.investByMonth || {};
  Object.keys(inv).forEach(k => { exp[k] = exp[k] || {expByDay:{}, total:0}; if(exp[k].invest==null) exp[k].invest = inv[k]; });
  return { shifts, exp, src: live ? 'live' : 'bundle', at: live ? null : L.generatedAt };
}
/* how much of a shift counts at `now` (mirrors the widget clock) */
function shiftSpan(s){
  const st = hm(s.start), en = hm(s.end); if(st==null || en==null) return null;
  const a = dOf(s.date).getTime() + st*6e4; let b = dOf(s.date).getTime() + en*6e4; if(b<=a) b += DAY;
  return [a,b];
}
function earnedNow(s, now){
  const sp = shiftSpan(s), t = now.getTime();
  if(s.planned){ if(sp) return t>=sp[1] ? s.amount : (t>=sp[0] ? s.amount*(t-sp[0])/(sp[1]-sp[0]) : 0); return s.date <= iso(now) ? 0 : 0; }
  if(!sp) return s.date <= iso(now) ? s.amount : 0;
  if(t<=sp[0]) return 0; if(t>=sp[1]) return s.amount; return s.amount*(t-sp[0])/(sp[1]-sp[0]);
}
const CAT_TH = { 'hourly (tiered)':'เวรรายชั่วโมง', 'patient exam':'ตรวจคนไข้', 'shift base rate':'ค่าเวรพื้นฐาน', 'oncall':'On call', 'hotel visit':'ตรวจที่โรงแรม' };
const catName = c => CAT_TH[(c||'').toLowerCase()] || c || 'รายการ';
function kindOf(cat){ const c = (cat||'').toLowerCase();
  if(/hour|exam|shift|base/.test(c)) return 'shift'; if(/admit/.test(c)) return 'admit'; if(/refer/.test(c)) return 'refer';
  if(/on ?call/.test(c)) return 'oncall'; if(/proc|slab|boot/.test(c)) return 'proc'; return 'other'; }
const KIND = { shift:['ชั่วโมง/เวร','var(--ledger)'], admit:['Admit','#7A6FD0'], refer:['Refer','#3E8FD0'], proc:['หัตถการ','#2F8A5F'], oncall:['On call','#C27C0E'], other:['อื่นๆ','var(--ink-faint)'] };
function monthStats(M, mk, now){
  const inMonth = M.shifts.filter(s => s.date.slice(0,7)===mk);
  const curMk = mkOf(now), isCur = mk===curMk, isPast = mk<curMk;
  const actualByDay = {}, bookedByDay = {}; let earned=0, booked=0, hours=0, unpaid=0, liveShift=null; const kinds = {};
  inMonth.forEach(s => {
    const e = isPast ? (s.planned ? 0 : s.amount) : isCur ? earnedNow(s, now) : 0;
    const rest = (isPast ? 0 : s.amount - e);
    actualByDay[s.date] = (actualByDay[s.date]||0) + e; bookedByDay[s.date] = (bookedByDay[s.date]||0) + Math.max(0, rest);
    earned += e; booked += s.amount; if(e>0) hours += (s.hours||0)*(e/(s.amount||1));
    if(!s.paid && e>0 && !s.planned) unpaid += e;
    const k = kindOf(s.cat); kinds[k] = kinds[k] || {n:0, v:0, h:0}; kinds[k].n++; kinds[k].v += isPast||isCur ? e : s.amount; kinds[k].h += (isPast||isCur) ? (s.hours||0)*(e/(s.amount||1)) : (s.hours||0);
    const sp = shiftSpan(s); if(isCur && sp && now>=sp[0] && now<sp[1]) liveShift = { s, sp, rate: s.amount/((sp[1]-sp[0])/36e5) };
  });
  const n = daysIn(mk), dayIdx = isCur ? now.getDate() : isPast ? n : 0;
  const pace = dayIdx>0 ? earned/dayIdx*n : 0;
  const today = isCur ? inMonth.filter(s => s.date===iso(now)).reduce((a,s)=>a+earnedNow(s,now),0) : 0;
  const E = M.exp[mk] || null;
  return { mk, inMonth, actualByDay, bookedByDay, earned, booked, hours, unpaid, kinds, liveShift, pace, today, dayIdx, isCur, isPast, exp:E };
}

/* ================= INVEST model ================= */
function investModel(){
  const I = (DATA && DATA.invest) || null; if(!I) return null;
  const fx = I.fx||{}, usd = fx.usdthb || 33.5, hkd = fx.hkdthb || usd/7.8;
  const toTHB = (v, ccy) => ccy==='USD' ? v*usd : ccy==='HKD' ? v*hkd : v;
  let val=0, cost=0, day=0; const rows = (I.holdings||[]).map(h => {
    const px = h.price||0, v = toTHB(px*(h.units||0), h.ccy), c = toTHB(h.cost||0, h.ccy), d = v - v/(1+(h.chg||0));
    val += v; cost += c; day += d; return Object.assign({}, h, { valTHB:v, costTHB:c, pl:v-c, plPct: c? (v-c)/c : 0, dayTHB:d });
  }).sort((a,b) => b.valTHB - a.valTHB);
  const cash = (I.cash && I.cash.amount) || 0;
  const total = val + cash;
  const byMkt = {}; rows.forEach(r => byMkt[r.market||'อื่นๆ'] = (byMkt[r.market||'อื่นๆ']||0) + r.valTHB);
  return { I, rows, val, cost, day, cash, total, byMkt, usd };
}

function healthModel(now){
  const H = (DATA && DATA.health) || null; if(!H || !H.plan || !H.plan.T) return null;
  const Pl = H.plan, start = dOf(Pl.START);
  const weekOf = d => Math.floor(Math.round((dOf(iso(d)) - start)/DAY)/7) + 1;
  const phaseOf = w => w<=4?'base': w<=8?'build': w<=12?'specific': w===13?'recovery':'doubles';
  const session = d => { const k = iso(d); if(Pl.SPECIAL[k]) return Pl.SPECIAL[k]; const w = weekOf(d);
    if(w<1 || w>21) return { title:'นอกโปรแกรม', detail:'โปรแกรมซ้อม 21 สัปดาห์', rest:true };
    const dow = d.getDay(); if(dow===1 || dow===4) return Pl.REST; return Pl.T[phaseOf(w)][dow] || Pl.REST; };
  const doneLocal = ls.get(K.hxDone, {}), kmLocal = ls.get(K.hxKm, {});
  const done = Object.assign({}, (H.state||{}).done||{}, doneLocal);
  const w = weekOf(now), monday = new Date(start.getTime() + (w-1)*7*DAY);

  return { H, Pl, w, phase:phaseOf(w), session, weekOf, done, monday, runsIn };
}

  if(hx){ const med = (hx.H.meds||[])[0]; if(med){ const nd = nextDose(med, now); if(nd.days<=1) notes.push(['health', `${esc(med.name)} ${esc(med.dose)} — ${nd.days<0?'เลยกำหนด':nd.days===0?'วันนี้':'พรุ่งนี้'} (${thDate(nd.due, true)})`]); }

  html += `</div>`;

function nextDose(med, now){
  const last = (med.log||[]).map(l => l.due).sort().pop() || med.start;
  const due = iso(new Date(dOf(last).getTime() + med.everyDays*DAY));
  return { due, days: Math.round((dOf(due) - dOf(iso(now)))/DAY), last };
}

  // trip
  const trip = (H.trip||[])[0];
  if(trip){ h += `<section class="card"><h2>ทริป ${trip.race==='hk-2027'?'🇭🇰 ฮ่องกง':'🇹🇼 ไทเป'}</h2><div class="list">${(trip.legs||[]).map(l => `<div class="li"><span style="font-size:18px">${l.type==='flight'?'✈️':l.type==='race'?'🏁':'📍'}</span><span class="grow"><span class="t">${esc(l.title)}</span><div class="s">${esc([l.from,l.to].filter(Boolean).join(' → '))} · ${thDate(l.start.slice(0,10),true)} ${l.start.slice(11,16)!=='00:00'?l.start.slice(11,16):''}</div></span><span class="chip pos">จองแล้ว</span></div>`).join('')}</div>
    ${(trip.todo||[]).length?`<div class="small" style="margin-top:8px"><b style="color:var(--warn)">ยังต้องทำ ${trip.todo.length}</b><ul class="plain">${trip.todo.slice(0,5).map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`:''}</section>`; }
  // events
  const ev = (H.events||[]).filter(e => (e.end||e.start) >= today).slice(0,8);
  if(ev.length) h += `<section class="card span3"><h2>สนามที่น่าไป<span class="meta">เช็กล่าสุด ${ago(H.eventsAt)}</span></h2><div class="list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));column-gap:24px">${ev.map(e => {
      const st = {on_sale:['เปิดจอง','pos'],sold_out:['เต็ม','neg'],presale:['พรีเซล','warn'],coming_soon:['เร็วๆ นี้',''],waitlist:['รอคิว','warn'],completed:['จบแล้ว','']}[e.status]||[e.status||'',''];
      return `<a class="li" href="${esc(e.url||'#')}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;border-top:1px solid var(--line)"><span style="font-size:22px">${e.flag||'🏁'}</span><span class="grow"><span class="t">${esc(e.city)}${e.mine?' · ของฉัน':e.fav?' ♥':''}</span><div class="s">${thDate(e.start)}${e.end&&e.end!==e.start?'–'+thDate(e.end):''} · ${esc(e.name)}</div></span>${st[0]?`<span class="chip ${st[1]}">${st[0]}</span>`:''}</a>`; }).join('')}</div></section>`;
  h += `</div>`;
  return h;
}

/* ================= router & events ================= */
const VIEWS = { home:vHome, ledger:vLedger, invest:vInvest, health:vHealth, settings:vSettings };
function render(){
  if(!VIEWS[S.view]) S.view = 'home';
  document.body.dataset.view = S.view;
  const main = $('#main');
  main.className = S.view==='invest'?'s-invest': S.view==='health'?'s-health':'s-ledger';
  main.innerHTML = VIEWS[S.view]();
  if(S.locked){ const top = main.querySelector('.top'); if(top) top.insertAdjacentHTML('afterend', unlockCard()); }
  const uf = $('#unlock'); if(uf) uf.addEventListener('submit', async e => { e.preventDefault(); const pw = $('#pw').value.trim(); if(!pw) return; $('#pwmsg').textContent = 'กำลังถอดรหัส…'; const ok = await tryUnlock(S.locked, pw); if(ok){ ls.set(K.key, pw); toast('ปลดล็อกแล้ว · ข้อมูล '+ago(DATA.generatedAt)); render(); } else $('#pwmsg').textContent = 'รหัสไม่ถูกต้อง'; });
  document.querySelectorAll('#nav button[data-go]').forEach(b => b.setAttribute('aria-current', b.dataset.go===S.view ? 'page' : 'false'));
  $('#navfoot').textContent = DATA ? 'ข้อมูล Mac · '+ago(DATA.generatedAt) : 'ยังไม่มีข้อมูล';
  const wq = $('#wq'); if(wq){ wq.addEventListener('input', () => { S.q = wq.value; const pos = wq.selectionStart; render(); const n = $('#wq'); n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} }); }
  const drop = $('#drop'); if(drop){
    ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if(f) readFile(f); });
  }
}
function go(v){ S.view = v; ls.set(K.view, v); render(); window.scrollTo({top:0}); }
function openSheet(html){ $('#sheetbody').innerHTML = html; document.body.classList.add('sheet-open'); }
function closeSheet(){ document.body.classList.remove('sheet-open'); }
$('#sheetbg').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if(e.key==='Escape') closeSheet(); });
(() => { let y0 = null; const sh = $('#sheet'); sh.addEventListener('touchstart', e => { if(sh.scrollTop<=0) y0 = e.touches[0].clientY; }, {passive:true});
  sh.addEventListener('touchmove', e => { if(y0!=null && e.touches[0].clientY - y0 > 90){ y0 = null; closeSheet(); } }, {passive:true}); sh.addEventListener('touchend', () => y0 = null); })();

function readFile(f){
  const r = new FileReader();
  r.onload = () => { try{ const d = JSON.parse(r.result); if(d.app!=='ledger-app-data') throw 0; DATA = d; ls.set(K.data, d); toast('นำเข้าแล้ว · ข้อมูล '+ago(d.generatedAt)); render(); }
    catch(e){ toast('ไฟล์นี้ไม่ใช่ ledger-app-data.json — เลือกไฟล์จาก iCloud Drive › Scriptable'); } };
  r.readAsText(f, 'utf-8');
}
$('#file').addEventListener('change', e => { const f = e.target.files[0]; e.target.value=''; if(f) readFile(f); });

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-act],[data-stock],[data-seg],[data-theme]'); if(!t) return;
  if(t.dataset.go){ go(t.dataset.go); return; }
  if(t.dataset.stock){ stockSheet(t.dataset.stock); return; }
  if(t.dataset.seg){ S.invSeg = t.dataset.seg; S.q=''; ls.set(K.invSeg, S.invSeg); render(); return; }
  if(t.dataset.theme){ ls.set(K.theme, t.dataset.theme); applyTheme(); render(); return; }
  const a = t.dataset.act, now = now0();
  if(a==='eye'){ document.body.classList.toggle('hide-amt'); ls.set(K.hide, document.body.classList.contains('hide-amt')); render(); }
  else if(a==='import'){ $('#file').click(); }
  else if(a==='mprev' || a==='mnext'){ const M = ledgerModel(); const months = [...new Set(M.shifts.map(s => s.date.slice(0,7)).concat(Object.keys(M.exp)))].sort(); const i = months.indexOf(S.ledMonth); const j = clamp(i + (a==='mprev'?-1:1), 0, months.length-1); S.ledMonth = months[j]; render(); }
  else if(a==='mnow'){ S.ledMonth = mkOf(now); render(); }
  else if(a==='hxdone'){ const d = ls.get(K.hxDone, {}), k = iso(now); const x = healthModel(now); if(x && x.done[k]) d[k] = false; else d[k] = true; if(d[k]===false && !((DATA.health.state||{}).done||{})[k]) delete d[k]; ls.set(K.hxDone, d); render(); }
  else if(a==='hxkm'){ const x = healthModel(now); if(!x) return; const v = parseFloat(String(prompt('วิ่งไปกี่กิโล? (ใส่ค่าติดลบเพื่อลบออก)','')||'').replace(',','.')); if(isNaN(v)) return; const km = ls.get(K.hxKm, {}); const wk = 'w'+x.w; km[wk] = Math.round(((+km[wk]||0)+v)*10)/10; ls.set(K.hxKm, km); toast('บันทึก '+v+' กม.'); render(); }
  else if(a==='forgetkey'){ try{ localStorage.removeItem(K.key); localStorage.removeItem(K.key+'~mirror'); }catch(e){} toast('ลืมรหัสแล้ว — ครั้งหน้าจะถามใหม่'); }
  else if(a==='wipe'){ if(confirm('ลบข้อมูลที่นำเข้าไว้ในเครื่องนี้? (ไม่กระทบ Locum Ledger และไฟล์บน Mac)')){ try{ [K.data,K.hxDone,K.hxKm].forEach(k => { localStorage.removeItem(k); localStorage.removeItem(k+'~mirror'); }); }catch(e){} DATA = null; render(); } }
});

function applyTheme(){ const t = ls.get(K.theme,'auto'); if(t==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); }
applyTheme();
if(ls.get(K.hide,false)) document.body.classList.add('hide-amt');

/* ticking: the live shift clock updates every second without re-rendering the page */
setInterval(() => {
  if(S.view!=='home' && S.view!=='ledger') return;
  const now = now0(), M = ledgerModel(), mk = S.view==='ledger' ? S.ledMonth : mkOf(now);
  if(mk!==mkOf(now)) return;
  const st = monthStats(M, mk, now); if(!st.liveShift) return;
  const el = $(S.view==='home'?'#h-earn':'#l-earn'); if(el) el.innerHTML = '<small>฿</small>'+Math.round(st.earned).toLocaleString('en-US');
  const td = $('#h-today'); if(td) td.textContent = B(st.today);
}, 1000);
// redraw when coming back to the app (date/prices may have moved on)
document.addEventListener('visibilitychange', () => { if(!document.hidden) render(); });

/* data published with the app (encrypted), or a plain file sitting next to it on the Mac */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function tryUnlock(enc, pw){
  try{
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', hash:'SHA-256', salt:b64(enc.salt), iterations:enc.iter||600000}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(enc.iv)}, key, b64(enc.ct));
    const d = JSON.parse(new TextDecoder().decode(pt)); if(d.app!=='ledger-app-data') return false;
    DATA = d; ls.set(K.data, d); S.locked = null; return true;
  }catch(e){ return false; }
}
async function loadRemote(){
  try{ const r = await fetch('./ledger-app-data.json', {cache:'no-store'}); if(r.ok){ const d = await r.json(); if(d.app==='ledger-app-data' && (!DATA || d.generatedAt > DATA.generatedAt)){ DATA = d; ls.set(K.data, d); render(); } } }catch(e){}
  try{ const r = await fetch('./data.enc', {cache:'no-store'}); if(!r.ok) return; const enc = await r.json();
    if(enc.app!=='ledger-app-enc' || (DATA && DATA.generatedAt >= enc.generatedAt)) return;
    const pw = ls.get(K.key, null);
    if(pw && await tryUnlock(enc, pw)){ render(); return; }
    S.locked = enc; render();
  }catch(e){}
}
render(); loadRemote();
document.addEventListener('visibilitychange', () => { if(!document.hidden) loadRemote(); });
</script>
